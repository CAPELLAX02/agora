# Agora yerel geliştirme ortamı.
# Kullanım: docker compose up -d  ·  durum: docker compose ps  ·  kapat: docker compose down
name: agora

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: agora
      POSTGRES_PASSWORD: agora_dev_password
      POSTGRES_DB: agora
      # Sunucu UTC'de çalışır. timestamptz değerleri zaten mutlak zamandır,
      # Europe/Istanbul dönüşümü sadece görüntüleme katmanında yapılır.
      PGTZ: UTC
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      # PostgreSQL 18 imajında veri dizini /var/lib/postgresql/18/docker altında,
      # bu yüzden volume bir üst dizine bağlanır.
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agora -d agora"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
