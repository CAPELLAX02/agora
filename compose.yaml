# Agora yerel geliştirme ortamı.
# Kullanım: docker compose up -d  ·  durum: docker compose ps  ·  kapat: docker compose down
name: agora

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: agora
      POSTGRES_PASSWORD: agora_dev_password
      POSTGRES_DB: agora
      # Sunucu UTC'de çalışır. timestamptz değerleri zaten mutlak zamandır,
      # Europe/Istanbul dönüşümü sadece görüntüleme katmanında yapılır.
      PGTZ: UTC
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      # PostgreSQL 18 imajında veri dizini /var/lib/postgresql/18/docker altında,
      # bu yüzden volume bir üst dizine bağlanır.
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agora -d agora"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      # k6 yük testleri (Faz 9) sonuçlarını buraya yazabilsin diye
      - --web.enable-remote-write-receiver
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      # Linux'ta da host.docker.internal adının çözülmesi için
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:13.2.3
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: agora_dev_password
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/agora-api.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
