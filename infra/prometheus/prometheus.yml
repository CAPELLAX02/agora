# Prometheus yapılandırması (yerel geliştirme).
# API ve worker Docker dışında (go run) çalıştığı için host.docker.internal üzerinden okunur.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: agora-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9091"]
        labels:
          service: agora-api
          env: development

  - job_name: agora-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9092"]
        labels:
          service: agora-worker
          env: development

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
