        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`QUOTA_EXCEEDS_CAPACITY`: toplam şube kontenjanını aşıyor, `BELOW_ENROLLED`: programdan kayıtlı öğrencinin altında"
