  /api/v1/calendar/windows:
    get:
      tags: [Akademik takvim]
      summary: İşlem pencerelerinin durumu
      description: |
        Her işlem penceresi türü için "şu an açık mı, ne zaman açılacak?" sorusunun hedefe
        göre cevabı. Dar kapsam geniş kapsamı geçersiz kılar: program için tanımlı olay varsa
        o, yoksa biriminin, o da yoksa üniversitenin olayları uygulanır. Dönem verilmezse
        aktif dönem kullanılır. `program_id` verilirse birimi programdan bulunur.
      operationId: getCalendarWindows
      x-agora-permission: calendar:read
      security:
        - bearerAuth: []
      parameters:
        - { name: term_id, in: query, schema: { type: string, format: uuid } }
        - { name: faculty_id, in: query, schema: { type: string, format: uuid } }
        - { name: program_id, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Pencereler
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CalendarWindows" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "`NO_CURRENT_TERM`"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/v1/terms/{id}/events:
    get:
      tags: [Akademik takvim]
      summary: Dönemin takvim olayları
      description: |
        Başlangıç zamanına göre sıralı. `faculty_id` ya da `program_id` verilirse sadece o
        hedefe uygulanan kapsamlar (üniversite + birim + program) döner. Yayımlanmamış
        (taslak) olayları sadece takvimi yönetenler görür.
      operationId: listTermEvents
      x-agora-permission: calendar:read
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ID"
        - { name: type, in: query, schema: { type: string, examples: ["COURSE_REGISTRATION"] } }
        - { name: faculty_id, in: query, schema: { type: string, format: uuid } }
        - { name: program_id, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Olaylar
          content:
            application/json:
