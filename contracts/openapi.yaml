        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/CodeTaken" }

  /api/v1/buildings/{id}:
    get:
      tags: [Organizasyon]
      summary: Bir binayı döndürür
      operationId: getBuilding
      security: []
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Bina
          headers:
            ETag: { schema: { type: string }, description: Güncellemede If-Match ile geri gönderilir }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Building" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Organizasyon]
      summary: Binayı günceller
      description: |
        Ad, birim ve etkinlik değiştirilebilir; yerleşke ve kod değiştirilemez. Hem mevcut hem
        yeni birim yetki kapsamında olmalıdır. İyimser kilit: `If-Match` zorunludur.
      operationId: updateBuilding
      x-agora-permission: classroom:manage
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, is_active]
              properties:
                faculty_id: { type: string, format: uuid }
                name: { type: string, minLength: 1, maxLength: 200 }
                is_active: { type: boolean }
      responses:
        "200":
          description: Güncel bina
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Building" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/VersionMismatch" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }

