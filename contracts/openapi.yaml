      x-agora-permission: curriculum:read
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Değerler
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/RegulationParameter" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Not ölçeği ve yönetmelik]
      summary: Parametreye yeni bir değer ekler
      description: >-
        Yeni değer `effective_from` gününden itibaren geçerli olur, son değer o gün kapanır.
        Yeni parametre tanımlanamaz (onu okuyan kural da kodda yazılmalı) ve değerin JSON türü
        değişemez. Üniversite kapsamlı yetki gerekir.
      operationId: setRegulationParameter
      x-agora-permission: gradescale:manage
      x-agora-mfa: true
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [value, effective_from]
              properties:
                value: { description: "Önceki değerle aynı JSON türünde (sayı, nesne, dizi ...)" }
                effective_from: { type: string, format: date, description: Son değerin başlangıcından sonra olmalı }
                note: { type: string, maxLength: 1000, description: Karar bilgisi vb. }
      responses:
        "201":
          description: Parametrenin güncel geçmişi
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/RegulationParameter" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/terms/{id}/offerings:
    get:
      tags: [Ders açma]
      summary: Dönemde açılan dersleri listeler
      description: >-
        Ders koduna göre sıralı, sayfalı. Açılan dersler ve programları herkese açıktır.
      operationId: listOfferings
      x-agora-permission: course:read
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ID"
        - name: department_id
          in: query
          description: Dersi açan bölüm
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/Query"
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/OfferingStatus" }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Liste
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Offering" } }
                  next_cursor: { type: string, description: Sonraki sayfa varsa dolu }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Ders açma]
      summary: Dönemde ders açar
      description: >-
        Açan bölümü kapsayan ders açma yetkisi gerekir. Bir ders bir dönemde bir kez açılır;
        farklı öğrenci grupları için şube eklenir. Yeni açılan ders planlama (PLANNED) durumundadır.
      operationId: createOffering
      x-agora-permission: offering:manage
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OfferingCreateRequest" }
      responses:
        "201":
          description: Açılan ders
          headers:
            ETag: { schema: { type: string } }
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OfferingDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`COURSE_ALREADY_OFFERED`: ders bu dönemde zaten açılmış, `TERM_CLOSED`: dönem kapanmış"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/v1/offerings/{id}:
    get:
      tags: [Ders açma]
      summary: Açılan dersi şubeleriyle döndürür
      operationId: getOffering
      x-agora-permission: course:read
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Açılan ders
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OfferingDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Ders açma]
      summary: Açılan dersin durumunu ve notlarını günceller
      description: >-
        Geçişler: PLANNED → OPEN → CLOSED, OPEN → PLANNED, PLANNED/OPEN → CANCELLED. İptal
        edilen dersin şubeleri de iptal olur, derslikleri boşalır. İyimser kilit, `If-Match` zorunlu.
      operationId: updateOffering
      x-agora-permission: offering:manage
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OfferingUpdateRequest" }
      responses:
        "200":
          description: Güncel ders
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OfferingDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`INVALID_STATUS_TRANSITION`: geçersiz durum geçişi, `HAS_ENROLLMENTS`: kayıtlı öğrenci varken iptal ya da planlamaya dönüş"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "412": { $ref: "#/components/responses/VersionMismatch" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
    delete:
      tags: [Ders açma]
      summary: Planlama aşamasındaki açılışı siler
      operationId: deleteOffering
      x-agora-permission: offering:manage
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204": { description: Silindi }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`INVALID_STATUS_TRANSITION`: sadece PLANNED açılış silinir, `HAS_ENROLLMENTS`"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/v1/offerings/{id}/sections:
    post:
      tags: [Ders açma]
      summary: Açılan derse şube ekler
      description: >-
        Dil verilmezse dersin dili, kontenjan modu verilmezse OPEN kullanılır.
      operationId: createSection
      x-agora-permission: section:manage
      security:
        - bearerAuth: []
