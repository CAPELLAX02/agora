        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Ders kataloğu]
      summary: Kataloğa ders ekler
      description: >-
        Sahibi bir bölüm olan dersi o bölümü kapsayan yetki, sahibi olmayan (üniversite ortak)
        dersi sadece üniversite kapsamlı yetki açabilir.
      operationId: createCourse
      x-agora-permission: course:manage
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CourseRequest" }
      responses:
        "201":
          description: Oluşturulan ders
          headers:
            ETag: { schema: { type: string } }
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: "`COURSE_CODE_TAKEN`: bu kodla bir ders zaten var"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/v1/courses/{id}:
    get:
      tags: [Ders kataloğu]
      summary: Dersi ilişkileriyle döndürür
      description: Ön koşullar, bu dersi isteyen dersler, eşdeğerlikler ve dersin bulunduğu seçmeli havuzlar.
      operationId: getCourse
      x-agora-permission: course:read
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Ders
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Ders kataloğu]
      summary: Dersi günceller
      description: >-
        Kod değişmez: saati, kredisi ya da AKTS'si değişen ders yeni kodla açılır ve eşdeğerlikle
        bağlanır. Başka bölüme devirde hem eski hem yeni sahip yetki alanında olmalı. İyimser
        kilit, `If-Match` zorunlu.
      operationId: updateCourse
      x-agora-permission: course:manage
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CourseRequest" }
      responses:
        "200":
          description: Güncel ders
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/VersionMismatch" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }

  /api/v1/courses/{id}/prerequisites:
    put:
      tags: [Ders kataloğu]
      summary: Dersin ön koşullarını değiştirir
      description: >-
        Verilen küme mevcut ön koşulların yerine geçer (boş dizi hepsini kaldırır). Aynı
        `group_no` içindekiler VEYA, farklı gruplar VE ile bağlanır. Yeni küme doğrudan ya da
        dolaylı bir döngü oluşturursa 409 döner.
      operationId: setCoursePrerequisites
      x-agora-permission: course:manage
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [items]
              properties:
                items:
                  type: array
                  maxItems: 20
                  items:
                    type: object
                    additionalProperties: false
                    required: [course_id]
                    properties:
                      course_id: { type: string, format: uuid }
                      requirement: { $ref: "#/components/schemas/PrerequisiteRequirement" }
                      group_no: { type: integer, minimum: 1, maximum: 20, default: 1 }
      responses:
        "200":
          description: Güncel ders
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`PREREQUISITE_CYCLE`: ön koşullar döngü oluşturuyor"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/v1/courses/{id}/equivalences:
    post:
      tags: [Ders kataloğu]
      summary: Dersle eski bir ders arasında eşdeğerlik tanımlar
      description: >-
        Yoldaki ders yeni, `equivalent_course_id` eski koddur (intibak). Aynı çift ters yönde
        de olsa bir kez bağlanabilir.
      operationId: addCourseEquivalence
      x-agora-permission: course:manage
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [equivalent_course_id]
              properties:
                equivalent_course_id: { type: string, format: uuid }
                is_bidirectional: { type: boolean, default: true, description: "Eski ders de yenisinin yerine sayılır mı?" }
                valid_from_year: { type: integer, minimum: 1946, maximum: 2100, description: Bu girişten itibaren geçerli }
                note: { type: string, maxLength: 500 }
      responses:
        "201":
          description: Güncel ders
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`EQUIVALENCE_EXISTS`: bu iki ders zaten eşdeğer"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/v1/courses/{id}/equivalences/{equivalenceId}:
    delete:
      tags: [Ders kataloğu]
      summary: Eşdeğerliği kaldırır
      description: Eşdeğerliğin iki dersinden birinin yolu üzerinden silinebilir.
      operationId: deleteCourseEquivalence
      x-agora-permission: course:manage
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ID"
        - name: equivalenceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Kaldırıldı }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

