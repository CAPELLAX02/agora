        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/courses:
    get:
      tags: [Ders kataloğu]
      summary: Dersleri listeler
      description: Koda göre sıralı, sayfalı. Varsayılan olarak sadece etkin dersler döner.
      operationId: listCourses
      x-agora-permission: course:read
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Query"
        - name: department_id
          in: query
          description: Sahibi bu bölüm olan dersler
          schema: { type: string, format: uuid }
        - name: kind
          in: query
          schema: { $ref: "#/components/schemas/CourseKind" }
        - $ref: "#/components/parameters/IncludeInactive"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Dersler
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Course" } }
