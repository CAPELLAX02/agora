        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Akademik takvim]
      summary: Döneme takvim olayı ekler
      description: |
        Aynı türden aynı kapsamda zaman olarak çakışan olay olamaz. Kapsam yetki alanında
        olmalıdır: üniversite kapsamı için üniversite genelinde takvim yetkisi gerekir.
        Aralık yarı açıktır: [starts_at, ends_at).
      operationId: createCalendarEvent
      x-agora-permission: calendar:manage
      x-agora-mfa: true
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CalendarEventRequest" }
      responses:
        "201":
          description: Oluşturulan olay
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CalendarEvent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
