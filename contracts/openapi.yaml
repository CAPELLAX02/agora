      description: Tür değiştirilemez. Hem mevcut hem yeni kapsam yetki alanında olmalıdır. `If-Match` zorunlu.
      operationId: updateCalendarEvent
      x-agora-permission: calendar:manage
      x-agora-mfa: true
      security:
