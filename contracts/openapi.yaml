        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT (EdDSA)

  parameters:
    ClientHeader:
      name: X-Agora-Client
      in: header
      required: true
      description: Refresh token'ın çerezde (web) mi gövdede (mobile) mi taşınacağını belirler.
      schema:
        type: string
        enum: [web, mobile]
    ID:
      name: id
      in: path
      required: true
      description: Geçerli bir UUID değilse 404 döner.
      schema: { type: string, format: uuid }
    Query:
      name: q
      in: query
      description: Kodda veya adda geçen metin (büyük/küçük harf ve Türkçe karakter duyarsız)
      schema: { type: string, maxLength: 100 }
    From:
      name: from
      in: query
      description: Bu andan itibaren (dahil), RFC 3339
      schema: { type: string, format: date-time }
    To:
      name: to
      in: query
      description: Bu ana kadar (hariç), RFC 3339
      schema: { type: string, format: date-time }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Cursor:
      name: cursor
      in: query
      description: Önceki yanıtın `next_cursor` değeri (opak)
      schema: { type: string }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Kaydı okurken alınan ETag (iyimser kilit). Kayıt bu arada değiştiyse 412 döner.
      schema: { type: string, examples: ['"3"'] }
    IncludeInactive:
      name: include_inactive
      in: query
      description: Pasif kayıtlar da dönsün mü?
      schema: { type: boolean, default: false }

  responses:
    Tokens:
      description: Giriş veya yenileme başarılı
      headers:
        Cache-Control:
          schema: { type: string, const: no-store }
        Set-Cookie:
          description: |
            Sadece web istemcisinde:
            `agora_refresh=<token>; Path=/api/v1/auth; Max-Age=<saniye>; HttpOnly; Secure; SameSite=Strict`
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Tokens" }
    BadRequest:
      description: |
        `INVALID_CLIENT` (X-Agora-Client eksik ya da geçersiz), `INVALID_BODY`
        (JSON bozuk, bilinmeyen alan, yanlış tür) ya da `VALIDATION_FAILED` (alan hataları
        `errors` dizisinde)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: |
        `AUTHENTICATION_REQUIRED` (Bearer token yok), `INVALID_TOKEN` (geçersiz veya
        süresi dolmuş) ya da `SESSION_REVOKED` (oturum çıkışla ya da güvenlik nedeniyle
        sonlandırılmış). İstemci bir kez refresh deneyip isteği tekrarlamalıdır. Refresh
        de başarısız olursa giriş ekranına yönlenmelidir.
      headers:
        WWW-Authenticate:
          schema: { type: string, examples: ['Bearer realm="agora", error="invalid_token"'] }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: |
        `FORBIDDEN` (gerekli yetki yok), `ACCOUNT_DISABLED` (hesap askıya alınmış veya
        kapatılmış), `PASSWORD_CHANGE_REQUIRED` (önce parola değiştirilmeli) ya da
        `MFA_REQUIRED` (yetki var ama bu oturum iki adımlı doğrulamayla açılmamış)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    CodeTaken:
      description: "`CODE_TAKEN`: aynı kodla kayıt zaten var"
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    VersionMismatch:
      description: "`VERSION_MISMATCH`: kayıt siz düzenlerken başka biri tarafından değiştirildi"
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    PreconditionRequired:
      description: "`PRECONDITION_REQUIRED`: If-Match başlığı eksik"
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    RateLimited:
      description: "`RATE_LIMITED`: bu IP'den çok sayıda istek"
      headers:
        Retry-After:
          schema: { type: integer, minimum: 0 }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ServiceUnavailable:
      description: |
        `SERVICE_UNAVAILABLE`: oturum iptal listesine (Redis) geçici olarak ulaşılamıyor.
        Token geçerli olabilir. İstemci oturumu kapatmadan biraz sonra tekrar denemelidir.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: "`NOT_FOUND`"
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    PayloadTooLarge:
      description: "`BODY_TOO_LARGE`: gövde 1 MiB'ı aşıyor"
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    UnsupportedMediaType:
      description: "`UNSUPPORTED_MEDIA_TYPE`: gövde application/json değil"
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Problem:
      type: object
      description: RFC 9457 Problem Details
      required: [type, title, status]
      properties:
        type: { type: string, examples: ["about:blank"] }
        title: { type: string, examples: ["Unauthorized"] }
        status: { type: integer, examples: [401] }
        detail: { type: string }
        instance: { type: string, examples: ["/api/v1/auth/login"] }
        code: { type: string, examples: ["INVALID_CREDENTIALS"] }
        request_id: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string, description: "Kullanıcıya gösterilebilir (Türkçe)" }
              code: { type: string, description: "Makine okunur kod (varsa), ör. TOO_SHORT" }

    Readiness:
      type: object
      required: [status, checks]
      properties:
        status: { type: string, enum: [ready, not_ready] }
        checks:
          type: object
          additionalProperties: { type: string, enum: [ok, unavailable] }

    ResetTokenBody:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string }

    RefreshTokenBody:
      type: object
      additionalProperties: false
      properties:
        refresh_token: { type: string }

    Tokens:
      type: object
      required: [access_token, token_type, expires_in, session_id, must_change_password]
      properties:
        access_token: { type: string }
        token_type: { type: string, const: Bearer }
        expires_in:
          type: integer
          description: Access token'ın kalan ömrü (saniye)
          examples: [900]
        refresh_token:
          type: string
          description: Sadece mobil istemcide
        refresh_expires_in:
          type: integer
          description: Sadece mobil istemcide. Refresh token'ın kalan ömrü (saniye)
        session_id: { type: string, format: uuid }
        must_change_password:
          type: boolean
          description: true ise istemci kullanıcıyı parola değiştirme ekranına yönlendirmeli

    MFAChallenge:
      type: object
      required: [mfa_required, mfa_token, expires_in]
      properties:
        mfa_required: { type: boolean, const: true }
        mfa_token:
          type: string
          description: "`POST /api/v1/auth/mfa/verify` ile gönderilir"
        expires_in:
          type: integer
          description: Kalan süre (saniye)
          examples: [300]

    MFAStatus:
      type: object
      required: [enabled, enabled_at, recovery_codes_remaining]
      properties:
        enabled: { type: boolean }
        enabled_at: { type: [string, "null"], format: date-time }
        recovery_codes_remaining: { type: integer, minimum: 0, maximum: 10 }

    MFASetup:
      type: object
      required: [secret, otpauth_uri]
      properties:
        secret:
          type: string
          description: Base32 (dolgusuz). QR okutulamazsa elle girilir
          examples: ["JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP"]
        otpauth_uri:
          type: string
          description: QR kod olarak gösterilir (SHA1, 6 hane, 30 sn)
          examples: ["otpauth://totp/Agora:22290001?algorithm=SHA1&digits=6&issuer=Agora&period=30&secret=JBSW..."]

    RecoveryCodes:
      type: object
      required: [recovery_codes]
      properties:
        recovery_codes:
          type: array
          minItems: 10
          maxItems: 10
          items: { type: string, examples: ["k7m2p-x9qaz"] }

    Profile:
      type: object
      required: [id, username, email, first_name, last_name, status, must_change_password, mfa_enabled, last_login_at, roles]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        email: { type: string, format: email }
        first_name: { type: string }
        last_name: { type: string }
        status: { type: string, enum: [PENDING, ACTIVE, SUSPENDED, DISABLED] }
        must_change_password: { type: boolean }
        mfa_enabled: { type: boolean }
        last_login_at: { type: [string, "null"], format: date-time }
        roles:
          type: array
          items: { $ref: "#/components/schemas/RoleAssignment" }

    RoleDefinition:
      type: object
      required: [code, name_tr, name_en, scope_type, description, permissions]
      properties:
        code: { type: string, examples: ["DEPARTMENT_HEAD"] }
        name_tr: { type: string }
        name_en: { type: string }
        scope_type: { type: string, enum: [UNIVERSITY, FACULTY, DEPARTMENT, PROGRAM, NONE] }
        description: { type: [string, "null"] }
        permissions:
          type: array
          items: { type: string }

    Assignment:
      type: object
      required: [id, role, role_name, scope_type, scope_id, scope_name, valid_from, valid_until, state, assigned_by, reason, created_at]
      properties:
        id: { type: string, format: uuid }
        role: { type: string }
        role_name: { type: string }
        scope_type: { type: string, enum: [UNIVERSITY, FACULTY, DEPARTMENT, PROGRAM, NONE] }
        scope_id: { type: [string, "null"], format: uuid }
        scope_name: { type: [string, "null"] }
        valid_from: { type: string, format: date-time }
        valid_until: { type: [string, "null"], format: date-time }
        state: { type: string, enum: [ACTIVE, UPCOMING, ENDED] }
        assigned_by: { type: [string, "null"], format: uuid, description: "Seed ve sistem atamalarında null" }
        reason: { type: [string, "null"] }
        created_at: { type: string, format: date-time }

    UserStatus:
      type: string
      enum: [PENDING, ACTIVE, SUSPENDED, DISABLED]

    UserSummary:
      type: object
      required: [id, username, email, first_name, last_name, status, kind, last_login_at, created_at]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        email: { type: string, format: email }
        first_name: { type: string }
        last_name: { type: string }
        status: { $ref: "#/components/schemas/UserStatus" }
        kind: { type: [string, "null"], enum: [STUDENT, STAFF, null] }
        last_login_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }

    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [kind, number, first_name, last_name, email]
      properties:
        kind: { type: string, enum: [STUDENT, STAFF] }
        number:
          type: string
          description: Öğrenci numarası (8-11 hane) ya da personel numarası (3-20 harf/rakam). Kullanıcı adı olur.
        first_name: { type: string, minLength: 1, maxLength: 100 }
        last_name: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, format: email, maxLength: 254 }
        staff_type: { type: string, enum: [ACADEMIC, ADMINISTRATIVE], description: Personelde zorunlu }
        academic_title: { type: string, examples: ["ASSIST_PROF"], description: Sadece akademik personelde }
        department_id: { type: string, format: uuid, description: Personelin bölümü (isteğe bağlı) }

    Me:
      allOf:
        - $ref: "#/components/schemas/Profile"
        - type: object
          required: [session_id, mfa_required]
          properties:
            session_id: { type: string, format: uuid }
            mfa_required:
              type: boolean
              description: |
                Kullanıcının bazı yetkileri bu oturumda iki adımlı doğrulama olmadığı için
                kullanılamıyor. İstemci MFA kurulumunu (ya da MFA ile yeniden girişi) önermeli.

    Grant:
      type: object
      required: [permission, scope_type, scope_id]
      properties:
        permission: { type: string, examples: ["quota:manage"] }
        scope_type: { type: string, enum: [UNIVERSITY, FACULTY, DEPARTMENT, PROGRAM, NONE] }
        scope_id:
          type: [string, "null"]
          format: uuid
          description: UNIVERSITY ve NONE kapsamlarında null

    RoleAssignment:
      type: object
      required: [role, role_name, scope_type, scope_id, scope_name, valid_until]
      properties:
        role: { type: string, examples: ["DEPARTMENT_HEAD"] }
        role_name: { type: string, examples: ["Bölüm Başkanı"] }
        scope_type: { type: string, enum: [UNIVERSITY, FACULTY, DEPARTMENT, PROGRAM, NONE] }
        scope_id:
          type: [string, "null"]
          format: uuid
          description: UNIVERSITY ve NONE kapsamlarında null
        scope_name:
          type: [string, "null"]
          examples: ["Bilgisayar Mühendisliği"]
        valid_until: { type: [string, "null"], format: date-time }

    Session:
      type: object
      required: [id, client, browser, os, device, ip, created_at, last_seen_at, expires_at, current]
      properties:
        id: { type: string, format: uuid }
        client: { type: string, enum: [WEB, MOBILE] }
        browser: { type: [string, "null"], examples: ["Chrome 140"] }
        os: { type: [string, "null"], examples: ["macOS"] }
        device: { type: string, enum: [DESKTOP, MOBILE, TABLET, UNKNOWN] }
        ip: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        expires_at:
          type: string
          format: date-time
          description: Boşta kalma ya da mutlak süreden hangisi önce dolarsa
        current: { type: boolean, description: İsteği yapan oturum mu }

    SecurityEventType:
      type: string
      enum:
        - LOGIN_SUCCEEDED
        - LOGIN_FAILED
        - ACCOUNT_LOCKED
        - LOGOUT
        - REFRESH_TOKEN_REUSED
        - PASSWORD_CHANGED
        - PASSWORD_RESET_REQUESTED
        - PASSWORD_RESET_COMPLETED
        - SESSION_REVOKED
        - OTHER_SESSIONS_REVOKED
        - MFA_ENABLED
        - MFA_DISABLED
        - MFA_CHALLENGE_STARTED
        - MFA_RECOVERY_CODES_RENEWED

    SecurityEvent:
      type: object
      required: [id, occurred_at, type, user_id, username, username_attempted, ip, user_agent, request_id, details]
      properties:
        id: { type: integer, format: int64 }
        occurred_at: { type: string, format: date-time }
        type: { $ref: "#/components/schemas/SecurityEventType" }
        user_id: { type: [string, "null"], format: uuid }
        username: { type: [string, "null"], description: "`user_id` hesabının kullanıcı adı" }
        username_attempted: { type: [string, "null"] }
        ip: { type: [string, "null"] }
        user_agent: { type: [string, "null"] }
        request_id: { type: [string, "null"] }
        details:
          type: object
          description: Olay türüne göre ayrıntılar (ör. reason, session_id, locked_until)
          additionalProperties: true

    SecurityEventPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SecurityEvent" }
        next_cursor: { type: string }

    AuditLogEntry:
      type: object
      required: [id, occurred_at, actor_user_id, actor_username, action, entity_type, entity_id, before, after, ip, user_agent, request_id]
      properties:
        id: { type: integer, format: int64 }
        occurred_at: { type: string, format: date-time }
        actor_user_id: { type: [string, "null"], format: uuid, description: Sistem işlemlerinde null }
        actor_username: { type: [string, "null"], description: İşlemi yapanın kullanıcı adı }
        action: { type: string, examples: ["role.assign"] }
        entity_type: { type: string, examples: ["user"] }
        entity_id: { type: [string, "null"] }
        before: { description: Değişiklikten önceki hal (oluşturmada null) }
        after: { description: Değişiklikten sonraki hal (silmede null) }
        ip: { type: [string, "null"] }
        user_agent: { type: [string, "null"] }
        request_id: { type: [string, "null"] }

    RoomType:
      type: string
      enum: [LECTURE, LAB, AMPHI, OFFICE, ONLINE]
    ClassroomFeature:
      type: string
      enum: [PROJECTOR, SMART_BOARD, COMPUTERS, ACCESSIBLE, AIR_CONDITIONING, SOUND_SYSTEM, RECORDING]

    Building:
      type: object
      required: [id, code, name, campus, faculty, is_active, classroom_count, version]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, examples: ["MUH-A"] }
        name: { type: string }
        campus:
          type: object
          required: [id, code, name]
          properties:
            id: { type: string, format: uuid }
            code: { type: string }
            name: { type: string }
        faculty:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Ref"
        is_active: { type: boolean }
        classroom_count: { type: integer, description: Aktif derslik sayısı }
        version: { type: integer }

    ClassroomInput:
      type: object
      additionalProperties: false
      required: [building_id, code, name, capacity, exam_capacity, room_type]
      properties:
        building_id: { type: string, format: uuid }
        code: { type: string, pattern: "^[A-Z0-9-]{1,20}$" }
        name: { type: string, minLength: 1, maxLength: 200 }
        capacity: { type: integer, minimum: 0, maximum: 2000 }
        exam_capacity: { type: integer, minimum: 0, description: Kapasiteden büyük olamaz }
        room_type: { $ref: "#/components/schemas/RoomType" }
        features: { type: array, items: { $ref: "#/components/schemas/ClassroomFeature" } }

    Classroom:
      type: object
      required: [id, code, name, building, campus, capacity, exam_capacity, room_type, features, is_active, version]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, examples: ["A101"] }
        name: { type: string }
        building:
          type: object
          required: [id, code, name]
          properties:
            id: { type: string, format: uuid }
            code: { type: string }
            name: { type: string }
        campus:
          type: object
          required: [id, code, name]
          properties:
            id: { type: string, format: uuid }
            code: { type: string }
            name: { type: string }
        capacity: { type: integer }
        exam_capacity: { type: integer }
        room_type: { $ref: "#/components/schemas/RoomType" }
        features: { type: array, items: { $ref: "#/components/schemas/ClassroomFeature" } }
        is_active: { type: boolean }
        version: { type: integer }

    EnrollmentStatus:
      type: string
      enum: [PREP, ACTIVE, FROZEN, SUSPENDED, GRADUATED, WITHDRAWN, DISMISSED]
    AdmissionType:
      type: string
      enum: [OSYS, DGS, YOS, TRANSFER_INTERNAL, TRANSFER_EXTERNAL, SPECIAL_TALENT, EXCHANGE]

    Advisor:
      type: object
      required: [staff_id, staff_no, title, first_name, last_name, since]
      properties:
        staff_id: { type: string, format: uuid }
        staff_no: { type: string }
        title: { type: [string, "null"], examples: ["Prof. Dr."] }
        first_name: { type: string }
        last_name: { type: string }
        since: { type: string, format: date-time }

    AdvisorHistoryItem:
      allOf:
        - $ref: "#/components/schemas/Advisor"
        - type: object
          required: [until, assigned_by, reason]
          properties:
            until: { type: [string, "null"], format: date-time, description: Aktif danışmanlıkta null }
            assigned_by: { type: [string, "null"], format: uuid }
            reason: { type: [string, "null"] }

    EligibleAdvisor:
      type: object
      required: [staff_id, staff_no, title, first_name, last_name, active_count]
      properties:
        staff_id: { type: string, format: uuid }
        staff_no: { type: string }
        title: { type: [string, "null"] }
        first_name: { type: string }
        last_name: { type: string }
        active_count: { type: integer, description: Şu anki danışmanlık sayısı }

    StudentProgram:
      type: object
      required: [id, student, program, kind, admission_type, admission_year, admitted_on, status, class_level, current_semester, gpa, earned_ects, advisor, curriculum]
      properties:
        id: { type: string, format: uuid }
        student:
          type: object
          required: [id, student_no, first_name, last_name]
          properties:
            id: { type: string, format: uuid }
            student_no: { type: string }
            first_name: { type: string }
            last_name: { type: string }
        program:
          type: object
          required: [id, code, name_tr, department, faculty]
          properties:
            id: { type: string, format: uuid }
            code: { type: string }
            name_tr: { type: string }
            department:
              type: object
              required: [id, name_tr]
              properties:
                id: { type: string, format: uuid }
                name_tr: { type: string }
            faculty:
              type: object
              required: [id, name_tr]
              properties:
                id: { type: string, format: uuid }
                name_tr: { type: string }
        kind: { type: string, enum: [MAJOR, DOUBLE_MAJOR, MINOR] }
        admission_type: { $ref: "#/components/schemas/AdmissionType" }
        admission_year: { type: integer }
        admitted_on: { type: string, format: date }
        status: { $ref: "#/components/schemas/EnrollmentStatus" }
        class_level: { type: integer, description: "0: hazırlık" }
        current_semester: { type: integer }
        gpa: { type: [number, "null"] }
        earned_ects: { type: number }
        advisor:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Advisor"
        curriculum:
          description: İzlenen müfredat sürümü; henüz bağlanmamışsa null
          oneOf:
            - type: "null"
            - type: object
              required: [id, name_tr, name_en]
              properties:
                id: { type: string, format: uuid }
                name_tr: { type: string }
                name_en: { type: string }

    Student:
      type: object
      required: [id, student_no, first_name, last_name, email, programs]
      properties:
        id: { type: string, format: uuid }
        student_no: { type: string }
        first_name: { type: string }
        last_name: { type: string }
        email: { type: [string, "null"], format: email }
        programs:
          type: array
          items: { $ref: "#/components/schemas/StudentProgram" }

    UnitType:
      type: string
      enum: [FACULTY, VOCATIONAL_SCHOOL, SCHOOL, INSTITUTE, CONSERVATORY]
    DegreeLevel:
      type: string
      enum: [ASSOCIATE, BACHELOR, MASTER, PHD]
    Language:
      type: string
      enum: [TR, EN, MIXED]
    EducationType:
      type: string
      enum: [DAYTIME, EVENING, DISTANCE]

    Ref:
      type: object
      required: [id, code, name_tr]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name_tr: { type: string }

    Faculty:
      type: object
      required: [id, code, name_tr, name_en, unit_type, campus, is_active]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, examples: ["MUH"] }
        name_tr: { type: string, examples: ["Mühendislik Fakültesi"] }
        name_en: { type: string, examples: ["Faculty of Engineering"] }
        unit_type: { $ref: "#/components/schemas/UnitType" }
        campus:
          oneOf:
            - type: "null"
            - type: object
              required: [id, code, name]
              properties:
                id: { type: string, format: uuid }
                code: { type: string }
                name: { type: string }
        is_active: { type: boolean }

    Department:
      type: object
      required: [id, code, name_tr, name_en, faculty, is_active]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, examples: ["BIL"] }
        name_tr: { type: string }
        name_en: { type: string }
        faculty: { $ref: "#/components/schemas/Ref" }
        is_active: { type: boolean }

    Program:
      type: object
      required:
        - id
        - code
        - yoksis_code
        - name_tr
        - name_en
        - degree_level
        - language
        - education_type
        - duration_semesters
        - max_duration_years
        - total_ects_required
        - has_prep_class
        - department
        - faculty
        - is_active
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        yoksis_code: { type: [string, "null"] }
        name_tr: { type: string }
        name_en: { type: string }
        degree_level: { $ref: "#/components/schemas/DegreeLevel" }
        language: { $ref: "#/components/schemas/Language" }
        education_type: { $ref: "#/components/schemas/EducationType" }
        duration_semesters: { type: integer, examples: [8] }
        max_duration_years: { type: integer, examples: [7] }
        total_ects_required: { type: number, examples: [240] }
        has_prep_class: { type: boolean }
        department: { $ref: "#/components/schemas/Ref" }
        faculty: { $ref: "#/components/schemas/Ref" }
        is_active: { type: boolean }

    TermType:
      type: string
      enum: [FALL, SPRING, SUMMER]

    TermStatus:
      type: string
      enum: [PLANNED, ACTIVE, CLOSED]

    Term:
      type: object
      required: [id, code, academic_year, start_year, term_type, starts_on, ends_on, status, is_current, version]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, examples: ["2026-FALL"] }
        academic_year: { type: string, examples: ["2026-2027"] }
        start_year: { type: integer, examples: [2026] }
        term_type: { $ref: "#/components/schemas/TermType" }
        starts_on: { type: string, format: date }
        ends_on: { type: string, format: date }
        status: { $ref: "#/components/schemas/TermStatus" }
        is_current: { type: boolean }
        version: { type: integer }

    AcademicYear:
      type: object
      required: [id, start_year, label, starts_on, ends_on, terms]
      properties:
        id: { type: string, format: uuid }
        start_year: { type: integer, examples: [2026] }
        label: { type: string, examples: ["2026-2027"] }
        starts_on: { type: string, format: date }
        ends_on: { type: string, format: date }
        terms: { type: array, items: { $ref: "#/components/schemas/Term" } }

    CalendarEventType:
      type: object
      required: [code, name_tr, name_en, category, is_action_window]
      properties:
        code: { type: string, examples: ["COURSE_REGISTRATION"] }
        name_tr: { type: string }
        name_en: { type: string }
        category: { type: string, enum: [REGISTRATION, INSTRUCTION, EXAM, GRADING, ADMISSION, OTHER] }
        is_action_window: { type: boolean }

    CalendarScopeType:
      type: string
      enum: [UNIVERSITY, FACULTY, PROGRAM]

    CalendarEvent:
      type: object
      required: [id, term_id, type, title_tr, title_en, starts_at, ends_at, scope_type, scope, is_published, note, version]
      properties:
        id: { type: string, format: uuid }
        term_id: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/CalendarEventType" }
        title_tr: { type: [string, "null"], description: Boşsa türün adı gösterilir }
        title_en: { type: [string, "null"] }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time, description: Hariç }
        scope_type: { $ref: "#/components/schemas/CalendarScopeType" }
        scope:
          type: [object, "null"]
          description: Birim ya da program, üniversite kapsamında null
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        is_published: { type: boolean }
        note: { type: [string, "null"] }
        version: { type: integer }

    CalendarEventRequest:
      type: object
      additionalProperties: false
      required: [starts_at, ends_at, scope_type]
      properties:
        type: { type: string, description: "Sadece oluşturmada zorunlu, sonradan değişmez" }
        title_tr: { type: string, maxLength: 200 }
        title_en: { type: string, maxLength: 200 }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        scope_type: { $ref: "#/components/schemas/CalendarScopeType" }
        scope_id: { type: string, format: uuid, description: Üniversite kapsamında boş }
        is_published: { type: boolean, default: true }
        note: { type: string, maxLength: 1000 }

    CalendarWindow:
      type: object
      required: [type, scope_type, open, current, next, events]
      properties:
        type: { $ref: "#/components/schemas/CalendarEventType" }
        scope_type:
          description: Uygulanan olayların kapsamı, hiç olay yoksa null
          oneOf:
            - $ref: "#/components/schemas/CalendarScopeType"
            - type: "null"
        open: { type: boolean }
        current:
          description: Şu an açık olan olay
          oneOf:
            - $ref: "#/components/schemas/CalendarEvent"
            - type: "null"
        next:
          description: Açık değilse sıradaki olay
          oneOf:
            - $ref: "#/components/schemas/CalendarEvent"
            - type: "null"
        events: { type: array, items: { $ref: "#/components/schemas/CalendarEvent" } }

    CalendarWindows:
      type: object
      required: [term, at, items]
      properties:
        term: { $ref: "#/components/schemas/Term" }
        at: { type: string, format: date-time, description: Sorgunun cevaplandığı an }
        items: { type: array, items: { $ref: "#/components/schemas/CalendarWindow" } }

    CourseKind:
      type: string
      description: >-
        NON_CREDIT ortalamaya girmez (ör. Üniversite Yaşamına Uyum), ACTIVITY bilimsel/kültürel
        etkinlik dersidir.
      enum: [REGULAR, NON_CREDIT, INTERNSHIP, PROJECT, PREP, ACTIVITY]
    GradingMode:
      type: string
      description: PASS_FAIL dersler BŞR/BŞZ ile notlandırılır.
      enum: [LETTER, PASS_FAIL]
    PrerequisiteRequirement:
      type: string
      description: PASSED dersten geçmiş, ATTENDED dersi almış ve devam şartını sağlamış olmak.
      enum: [PASSED, ATTENDED]
    ElectiveGroupKind:
      type: string
      enum: [TECHNICAL, UNIVERSITY_GENERAL, PEDAGOGICAL, SOCIAL, FREE]

    DepartmentRef:
      type: object
      required: [id, code, name_tr, name_en]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, examples: ["BIL"] }
        name_tr: { type: string }
        name_en: { type: string }

    Course:
      type: object
      required: [id, code, name_tr, name_en, owner_department, theory_hours, practice_hours, national_credit, ects,
                 language, kind, grading_mode, description_tr, description_en, learning_outcomes, is_active, version]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, examples: ["COM1001"] }
        name_tr: { type: string, examples: ["Bilgisayar Programlama I"] }
        name_en: { type: string, examples: ["Computer Programming I"] }
        owner_department:
          description: Boşsa üniversite ortak dersi
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/DepartmentRef"
        theory_hours: { type: integer, minimum: 0, maximum: 40 }
        practice_hours: { type: integer, minimum: 0, maximum: 40 }
        national_credit: { type: number, description: Ulusal kredi }
        ects: { type: number, examples: [6] }
        language: { type: string, enum: [TR, EN] }
        kind: { $ref: "#/components/schemas/CourseKind" }
        grading_mode: { $ref: "#/components/schemas/GradingMode" }
        description_tr: { type: [string, "null"] }
        description_en: { type: [string, "null"] }
        learning_outcomes: { type: array, items: { type: string } }
        is_active: { type: boolean }
        version: { type: integer }

    CourseRequest:
      type: object
      additionalProperties: false
      required: [name_tr, name_en, ects, language]
      properties:
        code:
          type: string
          pattern: "^[A-Za-z]{2,6}[0-9]{3,4}$"
          description: "Oluşturmada zorunlu, büyük harfe çevrilir. Güncellemede boş bırakılır ya da aynı gönderilir."
        owner_department_id: { type: string, format: uuid, description: Boşsa üniversite ortak dersi }
        name_tr: { type: string, minLength: 1, maxLength: 200 }
        name_en: { type: string, minLength: 1, maxLength: 200 }
        theory_hours: { type: integer, minimum: 0, maximum: 40, default: 0 }
        practice_hours: { type: integer, minimum: 0, maximum: 40, default: 0 }
        national_credit: { type: number, minimum: 0, maximum: 60, multipleOf: 0.1, default: 0 }
        ects: { type: number, minimum: 0, maximum: 60, multipleOf: 0.1 }
        language: { type: string, enum: [TR, EN] }
        kind: { $ref: "#/components/schemas/CourseKind" }
        grading_mode: { $ref: "#/components/schemas/GradingMode" }
        description_tr: { type: string, maxLength: 4000 }
        description_en: { type: string, maxLength: 4000 }
        learning_outcomes: { type: array, maxItems: 30, items: { type: string, maxLength: 500 } }
        is_active: { type: boolean, description: "Oluşturmada varsayılan true, güncellemede gönderilmezse değişmez" }

    CourseRef:
      type: object
      required: [id, code, name_tr, name_en, ects]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name_tr: { type: string }
        name_en: { type: string }
        ects: { type: number }

    ElectiveGroupRef:
      type: object
      required: [id, code, name_tr, name_en, kind]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, examples: ["COMTE02"] }
        name_tr: { type: string }
        name_en: { type: string }
        kind: { $ref: "#/components/schemas/ElectiveGroupKind" }

    CourseDetail:
      allOf:
        - $ref: "#/components/schemas/Course"
        - type: object
          required: [prerequisites, required_by, equivalences, elective_groups]
          properties:
            prerequisites:
              type: array
              description: Aynı group_no içindekiler VEYA, farklı gruplar VE ile bağlanır.
              items:
                type: object
                required: [course, requirement, group_no]
                properties:
                  course: { $ref: "#/components/schemas/CourseRef" }
                  requirement: { $ref: "#/components/schemas/PrerequisiteRequirement" }
                  group_no: { type: integer }
            required_by:
              type: array
              description: Bu dersi ön koşul olarak isteyen dersler
              items: { $ref: "#/components/schemas/CourseRef" }
            equivalences:
              type: array
              items:
                type: object
                required: [id, relation, course, is_bidirectional, valid_from_year, note]
                properties:
                  id: { type: string, format: uuid }
                  relation:
                    type: string
                    enum: [REPLACES, REPLACED_BY]
                    description: "REPLACES: bu ders diğerinin (eski kodun) yerini alır. REPLACED_BY: bu dersin yerini diğeri almıştır."
                  course: { $ref: "#/components/schemas/CourseRef" }
                  is_bidirectional: { type: boolean }
                  valid_from_year: { type: [integer, "null"] }
                  note: { type: [string, "null"] }
            elective_groups:
              type: array
              description: Dersin bulunduğu seçmeli havuzlar
              items: { $ref: "#/components/schemas/ElectiveGroupRef" }

    ElectiveGroup:
      type: object
      required: [id, code, name_tr, name_en, owner_department, kind, is_active, course_count, version]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, examples: ["COMTE02"] }
        name_tr: { type: string, examples: ["2. Sınıf Teknik Seçmeli Dersler"] }
        name_en: { type: string }
        owner_department:
          description: Boşsa üniversite geneli havuz
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/DepartmentRef"
        kind: { $ref: "#/components/schemas/ElectiveGroupKind" }
        is_active: { type: boolean }
        course_count: { type: integer }
        version: { type: integer }

    ElectiveGroupDetail:
      allOf:
        - $ref: "#/components/schemas/ElectiveGroup"
        - type: object
          required: [courses]
          properties:
            courses: { type: array, items: { $ref: "#/components/schemas/Course" } }

    ElectiveGroupRequest:
      type: object
      additionalProperties: false
      required: [name_tr, name_en, kind]
      properties:
        code:
          type: string
          pattern: "^[A-Za-z0-9]{3,20}$"
          description: "Oluşturmada zorunlu, büyük harfe çevrilir. Güncellemede boş bırakılır ya da aynı gönderilir."
        name_tr: { type: string, minLength: 1, maxLength: 200 }
        name_en: { type: string, minLength: 1, maxLength: 200 }
        owner_department_id: { type: string, format: uuid, description: Boşsa üniversite geneli havuz }
        kind: { $ref: "#/components/schemas/ElectiveGroupKind" }
        is_active: { type: boolean, description: "Oluşturmada varsayılan true, güncellemede gönderilmezse değişmez" }

    ProgramRef:
      type: object
      required: [id, code, name_tr, name_en]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, examples: ["BIL-EN"] }
        name_tr: { type: string }
        name_en: { type: string }

    CurriculumStatus:
      type: string
      description: "DRAFT: hazırlanıyor, ACTIVE: yürürlükte (giriş yılı aralığındaki öğrenciler izler), ARCHIVED: izleyen öğrencisi kalmadı"
      enum: [DRAFT, ACTIVE, ARCHIVED]

    Curriculum:
      type: object
      required: [id, program, name_tr, name_en, effective_from_year, effective_to_year, total_ects_required, status,
                 decision_ref, copied_from_id, activated_at, archived_at, student_count, version]
      properties:
        id: { type: string, format: uuid }
        program: { $ref: "#/components/schemas/ProgramRef" }
        name_tr: { type: string, examples: ["2026-2027 Müfredatı"] }
        name_en: { type: string }
        effective_from_year: { type: integer, description: Bu yıl ve sonrası girişliler, examples: [2026] }
        effective_to_year: { type: [integer, "null"], description: Boşsa yeni girişlere açık }
        total_ects_required: { type: number, examples: [240] }
        status: { $ref: "#/components/schemas/CurriculumStatus" }
        decision_ref: { type: [string, "null"], description: Senato kararı vb. }
        copied_from_id: { type: [string, "null"], format: uuid }
        activated_at: { type: [string, "null"], format: date-time }
        archived_at: { type: [string, "null"], format: date-time }
        student_count: { type: integer, description: Bu sürümü izleyen program kayıtları }
        version: { type: integer }

    CurriculumRequest:
      type: object
      required: [name_tr, name_en, effective_from_year, total_ects_required]
      properties:
        name_tr: { type: string, minLength: 1, maxLength: 200 }
        name_en: { type: string, minLength: 1, maxLength: 200 }
        effective_from_year: { type: integer, minimum: 1946, maximum: 2100 }
        effective_to_year: { type: [integer, "null"], minimum: 1946, maximum: 2100 }
        total_ects_required: { type: number, exclusiveMinimum: 0, maximum: 999, multipleOf: 0.1 }
        decision_ref: { type: string, maxLength: 200 }

    CurriculumItemType:
      type: string
      description: "COURSE: yarıyıla yerleşmiş ders, ELECTIVE_SLOT: seçmeli havuzdan alınacak bir dersin yeri"
      enum: [COURSE, ELECTIVE_SLOT]

    CurriculumItem:
      type: object
      required: [id, semester_no, item_type, code, name_tr, name_en, course, course_kind, has_prerequisites, elective_group,
                 theory_hours, practice_hours, national_credit, ects, is_compulsory, position]
      properties:
        id: { type: string, format: uuid }
        semester_no: { type: integer, minimum: 1, maximum: 12 }
        item_type: { $ref: "#/components/schemas/CurriculumItemType" }
        code: { type: string, description: Dersin ya da havuzun kodu, examples: ["COM1001", "COMTE02"] }
        name_tr: { type: string }
        name_en: { type: string }
        course:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/CourseRef"
        course_kind:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/CourseKind"
        has_prerequisites: { type: boolean }
        elective_group:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/ElectiveGroupRef"
        theory_hours: { type: integer }
        practice_hours: { type: integer }
        national_credit: { type: number }
        ects: { type: number, description: "Ders satırında dersin, yuvada yuvanın AKTS'si" }
        is_compulsory: { type: boolean }
        position: { type: integer, description: Yarıyıl içindeki sıra }

    CurriculumItemRequest:
      type: object
      additionalProperties: false
      required: [semester_no, item_type]
      properties:
        semester_no: { type: integer, minimum: 1, maximum: 12 }
        item_type: { $ref: "#/components/schemas/CurriculumItemType" }
        course_id: { type: string, format: uuid, description: Ders satırında zorunlu }
        elective_group_id: { type: string, format: uuid, description: Yuvada zorunlu }
        theory_hours: { type: integer, minimum: 0, maximum: 40, description: Sadece yuvada }
        practice_hours: { type: integer, minimum: 0, maximum: 40, description: Sadece yuvada }
        national_credit: { type: number, minimum: 0, maximum: 60, multipleOf: 0.1, description: Sadece yuvada }
        ects: { type: number, minimum: 0, maximum: 60, multipleOf: 0.1, description: Sadece yuvada }
        is_compulsory: { type: boolean, default: true, description: "Ders satırında varsayılan true, yuva zorunlu olamaz" }
        position: { type: integer, minimum: 0, maximum: 999, default: 0 }

    CurriculumDetail:
      allOf:
        - $ref: "#/components/schemas/Curriculum"
        - type: object
          required: [items, summary]
          properties:
            items: { type: array, items: { $ref: "#/components/schemas/CurriculumItem" } }
            summary:
              type: object
              required: [total_ects, total_credit, compulsory_ects, elective_ects, semesters, elective_kinds]
              properties:
                total_ects: { type: number }
                total_credit: { type: number }
                compulsory_ects: { type: number }
                elective_ects: { type: number }
                semesters:
                  type: array
                  items:
                    type: object
                    required: [semester_no, ects, national_credit, item_count]
                    properties:
                      semester_no: { type: integer }
                      ects: { type: number }
                      national_credit: { type: number }
                      item_count: { type: integer }
                elective_kinds:
                  type: array
                  description: Seçmeli grup türüne göre AKTS (teknik seçmeli, alan dışı ...)
                  items:
                    type: object
                    required: [kind, ects]
                    properties:
                      kind: { $ref: "#/components/schemas/ElectiveGroupKind" }
                      ects: { type: number }

    GradeItem:
      type: object
      required: [letter, coefficient, min_score, max_score, is_passing, counts_in_gpa, earns_ects, is_attendance_fail]
      properties:
        letter: { type: string, examples: ["B1"] }
        coefficient: { type: [number, "null"], description: "4'lük sistemde katsayı; ortalamaya girmeyen harflerde null", examples: [3.5] }
        min_score: { type: [number, "null"], description: "Puan aralığının alt ucu (dahil); puanla verilmeyen harflerde null" }
        max_score: { type: [number, "null"], description: Puan aralığının üst ucu (dahil) }
        is_passing: { type: boolean }
        counts_in_gpa: { type: boolean, description: Ağırlıklı not ortalamasına girer mi? }
        earns_ects: { type: boolean, description: AKTS kazandırır mı? }
        is_attendance_fail: { type: boolean, description: Devamsızlıktan kalma notu (F1) }

    GradeScale:
      type: object
      required: [id, code, name_tr, name_en, effective_from_year, is_default, items, version]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, examples: ["AU-LISANS"] }
        name_tr: { type: string }
        name_en: { type: string }
        effective_from_year: { type: integer }
        is_default: { type: boolean }
        items: { type: array, items: { $ref: "#/components/schemas/GradeItem" } }
        version: { type: integer }

    GradeScaleRequest:
      type: object
      additionalProperties: false
      required: [name_tr, name_en, effective_from_year, items]
      properties:
        code: { type: string, pattern: "^[A-Za-z0-9-]{2,30}$", description: "Sadece oluşturmada; büyük harfe çevrilir" }
        name_tr: { type: string, minLength: 1, maxLength: 200 }
        name_en: { type: string, minLength: 1, maxLength: 200 }
        effective_from_year: { type: integer, minimum: 1946, maximum: 2100 }
        is_default: { type: boolean, default: false }
        items: { type: array, minItems: 1, maxItems: 30, items: { $ref: "#/components/schemas/GradeItem" } }

    RegulationParameter:
      type: object
      required: [key, value, effective_from, effective_to, description_tr, note]
      properties:
        key: { type: string, examples: ["ects_limit_by_gpa"] }
        value: { description: "Parametreye göre sayı, nesne ya da dizi" }
        effective_from: { type: string, format: date }
        effective_to: { type: [string, "null"], format: date, description: "Hariç; null ise hâlâ geçerli" }
        description_tr: { type: string }
        note: { type: [string, "null"] }

    NamedRef:
      type: object
      description: Kodlu ve iki dilde adlı bir kaydın özeti (ders, birim ...)
      required: [id, code, name_tr, name_en]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name_tr: { type: string }
        name_en: { type: string }

    OfferingStatus:
      type: string
      description: "PLANNED: hazırlanıyor (ders seçmede görünmez), OPEN: ders seçmeye açık, CLOSED: dönem bitti, CANCELLED: açılmadı"
      enum: [PLANNED, OPEN, CLOSED, CANCELLED]

    InstructorRole:
      type: string
      description: "PRIMARY: sorumlu (not girişi ve değerlendirme planı), CO_INSTRUCTOR: ortak, ASSISTANT: yardımcı"
      enum: [PRIMARY, CO_INSTRUCTOR, ASSISTANT]

    Offering:
      type: object
      required: [id, term, course, department, status, external_ref, note, section_count, total_capacity, total_enrolled, version]
      properties:
        id: { type: string, format: uuid }
        term:
          type: object
          required: [id, code]
          properties:
            id: { type: string, format: uuid }
            code: { type: string, examples: ["2026-FALL"] }
        course:
          allOf:
            - $ref: "#/components/schemas/NamedRef"
            - type: object
              required: [theory_hours, practice_hours, national_credit, ects, language]
              properties:
                theory_hours: { type: integer }
                practice_hours: { type: integer }
                national_credit: { type: number }
                ects: { type: number }
                language: { type: string, enum: [TR, EN] }
        department: { $ref: "#/components/schemas/DepartmentRef" }
        status: { $ref: "#/components/schemas/OfferingStatus" }
        external_ref: { type: [string, "null"], description: Eski sistemdeki ders açma numarası }
        note: { type: [string, "null"] }
        section_count: { type: integer, description: Etkin şube sayısı }
        total_capacity: { type: integer }
        total_enrolled: { type: integer }
        version: { type: integer }

    OfferingDetail:
      allOf:
        - $ref: "#/components/schemas/Offering"
        - type: object
          required: [sections]
          properties:
            sections: { type: array, items: { $ref: "#/components/schemas/Section" } }

    OfferingCreateRequest:
      type: object
      additionalProperties: false
      required: [course_id, department_id]
      properties:
        course_id: { type: string, format: uuid }
        department_id: { type: string, format: uuid, description: Dersi açan bölüm }
        external_ref: { type: string, maxLength: 50 }
        note: { type: string, maxLength: 1000 }

    OfferingUpdateRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { $ref: "#/components/schemas/OfferingStatus" }
        external_ref: { type: string, maxLength: 50 }
        note: { type: string, maxLength: 1000 }

    Instructor:
      type: object
      required: [staff_id, staff_no, title, first_name, last_name, role]
      properties:
        staff_id: { type: string, format: uuid }
        staff_no: { type: string }
        title: { type: [string, "null"], examples: ["Doç. Dr."] }
        first_name: { type: string }
        last_name: { type: string }
        role: { $ref: "#/components/schemas/InstructorRole" }

    ScheduleSlot:
      type: object
      required: [id, day_of_week, start_time, end_time, session_type, classroom]
      properties:
        id: { type: string, format: uuid }
        day_of_week: { type: integer, minimum: 1, maximum: 7, description: "ISO: 1 pazartesi, 7 pazar" }
        start_time: { type: string, pattern: "^[0-2][0-9]:[0-5][0-9]$", examples: ["09:00"] }
        end_time: { type: string, pattern: "^[0-2][0-9]:[0-5][0-9]$", description: Hariç, examples: ["10:50"] }
        session_type: { type: string, enum: [THEORY, PRACTICE, LAB] }
        classroom:
          description: Çevrim içi oturumda null
          oneOf:
            - type: "null"
            - type: object
              required: [id, code, name, building_code, capacity]
              properties:
                id: { type: string, format: uuid }
                code: { type: string }
                name: { type: string }
                building_code: { type: string }
                capacity: { type: integer }

    ScheduleSlotRequest:
      type: object
      additionalProperties: false
      required: [day_of_week, start_time, end_time]
      properties:
        day_of_week: { type: integer, minimum: 1, maximum: 7 }
        start_time: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$", description: "07:00 ve sonrası" }
        end_time: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$", description: "Hariç; 23:00 ve öncesi" }
        classroom_id: { type: string, format: uuid, description: Çevrim içi oturumda boş }
        session_type: { type: string, enum: [THEORY, PRACTICE, LAB], default: THEORY }

    Section:
      type: object
      required: [id, offering_id, section_code, capacity, enrolled_count, quota_mode, instruction_mode, language, status,
                 instructors, quotas, slots, version]
      properties:
        id: { type: string, format: uuid }
        offering_id: { type: string, format: uuid }
        section_code: { type: string, examples: ["1"] }
        capacity: { type: integer }
        enrolled_count: { type: integer }
        quota_mode: { type: string, enum: [OPEN, RESERVED], description: "RESERVED: sadece kontenjan ayrılmış programlardan" }
        instruction_mode: { type: string, enum: [IN_PERSON, ONLINE, HYBRID] }
        language: { type: string, enum: [TR, EN] }
        status: { type: string, enum: [ACTIVE, CANCELLED] }
        instructors: { type: array, items: { $ref: "#/components/schemas/Instructor" } }
        quotas:
          type: array
          items:
            type: object
            required: [program, quota, enrolled]
            properties:
              program: { $ref: "#/components/schemas/ProgramRef" }
              quota: { type: integer }
              enrolled: { type: integer }
        slots: { type: array, items: { $ref: "#/components/schemas/ScheduleSlot" } }
        version: { type: integer }

    SectionRequest:
      type: object
      additionalProperties: false
      properties:
        section_code: { type: string, pattern: "^[A-Za-z0-9]{1,3}$", description: "Sadece oluşturmada (zorunlu)" }
        capacity: { type: integer, minimum: 0, maximum: 2000, description: Oluşturmada zorunlu }
        quota_mode: { type: string, enum: [OPEN, RESERVED] }
        instruction_mode: { type: string, enum: [IN_PERSON, ONLINE, HYBRID] }
        language: { type: string, enum: [TR, EN] }
        status: { type: string, enum: [ACTIVE, CANCELLED], description: Sadece güncellemede }

    ScheduleEntry:
      allOf:
        - $ref: "#/components/schemas/ScheduleSlot"
        - type: object
          required: [term_id, offering_id, section_id, section_code, course, instructors]
          properties:
            term_id: { type: string, format: uuid }
            offering_id: { type: string, format: uuid }
            section_id: { type: string, format: uuid }
            section_code: { type: string }
            course: { $ref: "#/components/schemas/NamedRef" }
            instructors: { type: array, items: { $ref: "#/components/schemas/Instructor" } }

    StaffSummary:
      type: object
      required: [staff_id, staff_no, title, first_name, last_name, department]
      properties:
        staff_id: { type: string, format: uuid }
        staff_no: { type: string }
        title: { type: [string, "null"] }
        first_name: { type: string }
        last_name: { type: string }
        department:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/DepartmentRef"
