openapi: 3.1.0
info:
  title: Agora API
  version: 0.1.0
  summary: Ankara Üniversitesi öğrenci bilgi sistemi ve öğrenme ortamı API'si
  description: |
    Agora API'nin sözleşmesidir (contract-first): uç noktalar önce burada tasarlanır,
    backend bu sözleşmeye göre yazılır, web istemcisi de buradan üretilir.

    **Hata yanıtları** RFC 9457 `application/problem+json` biçimindedir. İstemciler
    `code` alanına göre karar verir. `detail` kullanıcıya gösterilebilir ama
    değişebilir.

    **Kimlik doğrulama:** korumalı uç noktalar `Authorization: Bearer <access_token>`
    ister. Access token 15 dakika geçerlidir. Süresi dolunca `POST /api/v1/auth/refresh`
    ile yenisi alınır.

    **Yetkilendirme:** yetkiler token'a gömülmez, her korumalı istekte sunucuda güncel
    olarak çözülür. Rol değişikliği ya da hesabın askıya alınması anında etkilidir.
    Belirli bir yetki gerektiren uçlarda yetki `x-agora-permission` alanında yazar.

    **Parola değiştirme zorunluluğu:** `must_change_password` açık bir kullanıcı sadece
    kendi hesabıyla ilgili uçlara (`/api/v1/me...`) erişebilir. Diğer bütün korumalı
    uçlar `403 PASSWORD_CHANGE_REQUIRED` döner. İstemci kullanıcıyı parola değiştirme
    ekranına yönlendirmelidir.

    **İki adımlı doğrulama (MFA):** hesabında MFA açık kullanıcının girişi iki adımlıdır:
    `POST /api/v1/auth/login` parola doğruysa token yerine `mfa_required: true` ve kısa
    ömürlü bir `mfa_token` döner, giriş `POST /api/v1/auth/mfa/verify` ile tamamlanır.
    Hassas yetkiler (`x-agora-mfa: true` işaretli uçlar: hesap ve rol yönetimi, denetim
    izi, not girme) sadece MFA ile açılmış oturumlarda kullanılabilir. MFA'sız oturum
    bu uçlarda `403 MFA_REQUIRED` alır ve `GET /api/v1/me` yanıtında `mfa_required: true`
    görünür.

    **İstemci türü:** `/api/v1/auth/*` uçları `X-Agora-Client` başlığını zorunlu tutar.
    - `web`: refresh token `agora_refresh` adlı HttpOnly çerezde taşınır, gövdede yer almaz.
    - `mobile`: refresh token yanıt gövdesinde verilir ve istek gövdesinde geri gönderilir.
servers:
  - url: http://localhost:8080
    description: Yerel geliştirme
security:
  - bearerAuth: []
tags:
  - name: Sağlık
    description: Yük dengeleyici ve orkestratör için canlılık ve hazır olma kontrolleri
  - name: Kimlik doğrulama
    description: Giriş, token yenileme ve çıkış
  - name: Hesap
    description: Oturum açmış kullanıcının kendi bilgileri
  - name: Kullanıcılar
    description: Kullanıcı hesaplarının yönetimi
  - name: Organizasyon
    description: Kampüs, akademik birim, bölüm ve program kataloğu (herkese açık)
  - name: Öğrenciler
    description: Program kayıtları ve danışmanlık
  - name: Denetim
    description: Denetim izi ve güvenlik olayları (sistem yöneticisi ve denetçi)
  - name: Akademik takvim
    description: Akademik yıllar, dönemler ve işlem pencereleri (ders seçme, not girişi ...)
  - name: Ders kataloğu
    description: Dersler, ön koşullar, eşdeğerlikler (intibak) ve seçmeli ders grupları
  - name: Müfredat
    description: Programların versiyonlu ders planları (müfredat sürümleri) ve öğrencinin izlediği plan
  - name: Not ölçeği ve yönetmelik
    description: Harf notları, katsayılar, puan aralıkları ve tarihli yönetmelik parametreleri
  - name: Ders açma
    description: Dönemde açılan dersler, şubeler, kontenjanlar, öğretim elemanları ve haftalık program

paths:
  /healthz:
    get:
      tags: [Sağlık]
      summary: Canlılık kontrolü
      description: Süreç ayakta mı? Bağımlılıklara bakmaz.
      operationId: healthz
      security: []
      responses:
        "200":
          description: Süreç çalışıyor
          content:
            application/json:
              schema:
                type: object
                required: [status, version, uptime]
                properties:
                  status: { type: string, const: ok }
                  version: { type: string, examples: ["0.1.0"] }
                  uptime: { type: string, examples: ["1h2m3s"] }

  /readyz:
    get:
      tags: [Sağlık]
      summary: Hazır olma kontrolü
      description: Bu instance trafik almaya hazır mı? Bağımlılıklardan biri yanıt vermezse 503 döner.
      operationId: readyz
      security: []
      responses:
        "200":
          description: Hazır
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
        "503":
          description: Bir bağımlılık yanıt vermiyor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }

  /api/v1/auth/login:
    post:
      tags: [Kimlik doğrulama]
      summary: Giriş
      description: |
        Kullanıcı adı (öğrenci veya personel numarası, büyük/küçük harf duyarsız) ve
        parolayla yeni bir oturum açar.

        Var olmayan kullanıcı ile yanlış parola aynı yanıtı alır. 5 başarısız denemeden
        sonra hesap 1 dakika kilitlenir ve her yeni başarısız denemede süre ikiye katlanır
        (en fazla 1 saat).

        Ayrıca IP başına hız sınırı vardır (varsayılan dakikada 20 deneme, IPv6'da /64
        ağı başına). Sınır doğru ya da yanlış her denemeyi sayar.

        Hesapta iki adımlı doğrulama açıksa oturum henüz açılmaz: yanıt `MFAChallenge`
        olur (`mfa_required: true`), çerez yazılmaz. İstemci kullanıcıdan doğrulayıcı
        uygulamadaki kodu ister ve `POST /api/v1/auth/mfa/verify` çağırır. Başarısız
        deneme sayacı bu adımda sıfırlanmaz, giriş tamamlanınca sıfırlanır.
      operationId: login
      security: []
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, password]
              properties:
                username: { type: string, minLength: 1, maxLength: 64, examples: ["22290001"] }
                password: { type: string, minLength: 1, format: password }
      responses:
        "200":
          description: Giriş tamamlandı (`Tokens`) ya da ikinci adım bekleniyor (`MFAChallenge`)
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
            Set-Cookie:
              description: Sadece web istemcisinde ve sadece giriş tamamlandığında (bkz. `Tokens` yanıtı)
              schema: { type: string }
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Tokens"
                  - $ref: "#/components/schemas/MFAChallenge"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: "`INVALID_CREDENTIALS`: kullanıcı adı veya parola hatalı"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          description: "`ACCOUNT_DISABLED`: parola doğru ama hesap aktif değil"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429":
          description: |
            `ACCOUNT_LOCKED` (bu hesapta çok sayıda başarısız deneme, hesap geçici olarak
            kilitli) ya da `RATE_LIMITED` (bu IP'den çok sayıda giriş denemesi)
          headers:
            Retry-After:
              description: Kilidin bitmesine ya da yeni bir deneme hakkının açılmasına kalan saniye
              schema: { type: integer, minimum: 0 }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/v1/auth/mfa/verify:
    post:
      tags: [Kimlik doğrulama]
      summary: Girişin ikinci adımı
      description: |
        Girişte alınan `mfa_token` ile doğrulayıcı uygulamadaki 6 haneli kodu (`code`) ya
        da bir kurtarma kodunu (`recovery_code`) gönderir. İkisinden tam olarak biri
        verilmelidir. Başarılıysa oturum açılır, yanıt girişle aynıdır.

        `mfa_token` 5 dakika geçerlidir ve en fazla 5 kod denemesi kabul eder. Yanlış kod
        hesabın başarısız deneme sayacını artırır (yanlış parola gibi). Aynı kod ve aynı
        kurtarma kodu ikinci kez kabul edilmez. Token, girişin başladığı istemci türüyle
        (`X-Agora-Client`) kullanılmalıdır. Hız sınırı girişle ortaktır.
      operationId: verifyMfa
      security: []
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [mfa_token]
              properties:
                mfa_token: { type: string }
                code: { type: string, pattern: "^[0-9 ]{6,7}$", examples: ["492039"] }
                recovery_code: { type: string, maxLength: 32, examples: ["k7m2p-x9qaz"] }
      responses:
        "200": { $ref: "#/components/responses/Tokens" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: |
            `INVALID_MFA_CODE` (kod hatalı, aynı token'la tekrar denenebilir) ya da
            `INVALID_MFA_TOKEN` (token geçersiz, süresi dolmuş ya da deneme hakkı bitmiş:
            kullanıcı parolasını yeniden girmeli)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          description: "`ACCOUNT_DISABLED`: hesap bu arada askıya alınmış"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429":
          description: "`ACCOUNT_LOCKED` ya da `RATE_LIMITED` (bkz. giriş)"
          headers:
            Retry-After:
              schema: { type: integer, minimum: 0 }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/v1/auth/refresh:
    post:
      tags: [Kimlik doğrulama]
      summary: Token yenileme
      description: |
        Refresh token'ı tek kullanımlık olarak tüketir ve yerine yenisini verir (rotasyon).
        Web istemcisi gövde göndermez, token çerezden okunur. Mobil istemci token'ı
        gövdede gönderir.

        Daha önce kullanılmış bir token tekrar gelirse token'ın çalındığı varsayılır ve
        oturum tamamen sonlandırılır. Aynı token'la 10 saniye içinde gelen ikinci istek
        (eşzamanlı sekmeler) ise oturumu sonlandırmadan reddedilir.

        Hata durumunda web istemcisinin çerezi silinir. İstemci bu uçtan gelen 401'de
        tekrar refresh denememeli, giriş ekranına yönlenmelidir.
      operationId: refresh
      security: []
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        description: Sadece mobil istemci gönderir.
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshTokenBody" }
      responses:
        "200": { $ref: "#/components/responses/Tokens" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: "`INVALID_REFRESH_TOKEN`: token yok, geçersiz, süresi dolmuş ya da oturum sonlandırılmış"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          description: "`ACCOUNT_DISABLED`: hesap devre dışı bırakılmış, oturum sonlandırıldı"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }

  /api/v1/auth/logout:
    post:
      tags: [Kimlik doğrulama]
      summary: Çıkış
      description: |
        Refresh token'ın bağlı olduğu oturumu sonlandırır. Token bilinmiyor ya da zaten
        geçersizse de 204 döner. Web istemcisinin çerezi silinir.
      operationId: logout
      security: []
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        description: Sadece mobil istemci gönderir.
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshTokenBody" }
      responses:
        "204":
          description: Oturum sonlandırıldı
        "400": { $ref: "#/components/responses/BadRequest" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }

  /api/v1/auth/password/forgot:
    post:
      tags: [Kimlik doğrulama]
      summary: Parola sıfırlama bağlantısı iste
      description: |
        Öğrenci/personel numarası ya da e-postayla hesap bulunur ve kayıtlı e-postaya
        30 dakika geçerli, tek kullanımlık bir bağlantı gönderilir. Hesap olsun ya da
        olmasın yanıt **her zaman** 202'dir: yanıttan bir hesabın kayıtlı olup olmadığı
        anlaşılamaz. Aynı hesaba 2 dakika içinde ikinci bir e-posta gönderilmez. Yeni
        bir istek, önceki bağlantıları geçersiz kılar.

        Bağlantı biçimi: `{web}/sifre-sifirla#token=...`. Token URL'nin parça (#)
        kısmındadır, tarayıcı onu sunucuya göndermez. Web arayüzü token'ı okuyup
        adres çubuğundan silmelidir.
      operationId: forgotPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [identifier]
              properties:
                identifier:
                  type: string
                  maxLength: 254
                  description: Öğrenci/personel numarası ya da e-posta
      responses:
        "202":
          description: İstek alındı (hesap varsa e-posta gönderilir)
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/auth/password/reset/verify:
    post:
      tags: [Kimlik doğrulama]
      summary: Sıfırlama ya da aktivasyon bağlantısını doğrula
      description: Form gösterilmeden önce bağlantının hâlâ geçerli olup olmadığını söyler. Bağlantıyı tüketmez.
      operationId: verifyResetToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResetTokenBody" }
      responses:
        "200":
          description: Bağlantı geçerli
          content:
            application/json:
              schema:
                type: object
                required: [purpose, expires_at]
                properties:
                  purpose:
                    type: string
                    enum: [RESET, ACTIVATION]
                    description: ACTIVATION ise arayüz "hesabınızı etkinleştirin" metnini gösterir
                  expires_at: { type: string, format: date-time }
        "400":
          description: "`INVALID_RESET_TOKEN`: bağlantı geçersiz, kullanılmış ya da süresi dolmuş"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/auth/password/reset:
    post:
      tags: [Kimlik doğrulama]
      summary: Bağlantıyla yeni parola belirle
      description: |
        Bağlantı tek kullanımlıktır. Başarılı olursa kullanıcının **bütün** oturumları
        kapatılır, hesap kilidi kalkar ve hesap PENDING ise etkinleşir (aktivasyon).
        Parola politikaya uymazsa bağlantı tüketilmez, kullanıcı tekrar deneyebilir.
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, new_password]
              properties:
                token: { type: string }
                new_password: { type: string, format: password, minLength: 10, maxLength: 128 }
      responses:
        "204":
          description: Parola belirlendi
        "400":
          description: "`VALIDATION_FAILED` (politika ihlali, bkz. parola değiştirme) ya da `INVALID_RESET_TOKEN`"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/me:
    get:
      tags: [Hesap]
      summary: Oturum açmış kullanıcının profili
      description: Kullanıcı bilgileri ve şu anda geçerli rol atamaları.
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Profil
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/me/mfa:
    get:
      tags: [Hesap]
      summary: İki adımlı doğrulama durumu
      operationId: getMyMfa
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Durum
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MFAStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/me/mfa/setup:
    post:
      tags: [Hesap]
      summary: İki adımlı doğrulama kurulumunu başlatır
      description: |
        Yeni bir TOTP sırrı üretir. İstemci `otpauth_uri`'yi QR kod olarak gösterir,
        okutulamazsa `secret` elle girilir. Kurulum `POST /api/v1/me/mfa/enable` ile
        tamamlanana kadar MFA kapalıdır. Tamamlanmamış kurulum yeniden başlatılabilir,
        eski sır geçersiz olur.
      operationId: startMfaSetup
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Sır üretildi
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MFASetup" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: "`MFA_ALREADY_ENABLED`"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/v1/me/mfa/enable:
    post:
      tags: [Hesap]
      summary: İki adımlı doğrulamayı açar
      description: |
        Mevcut parola ve doğrulayıcı uygulamadaki kod istenir. Yanlış parola başarısız
        deneme sayacını artırır. Başarılıysa 10 kurtarma kodu döner: kodlar sadece bu
        yanıtta görünür.

        Kullanıcının diğer bütün oturumları kapatılır. İsteği yapan oturum MFA'lı sayılır:
        istemci `POST /api/v1/auth/refresh` ile yeni access token almalıdır.
      operationId: enableMfa
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [current_password, code]
              properties:
                current_password: { type: string, format: password }
                code: { type: string, examples: ["492039"] }
      responses:
        "200":
          description: MFA açıldı
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryCodes" }
        "400":
          description: "`VALIDATION_FAILED`, `INVALID_CURRENT_PASSWORD` ya da `INVALID_MFA_CODE`"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: "`MFA_ALREADY_ENABLED` ya da `MFA_SETUP_REQUIRED` (önce kurulum başlatılmalı)"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429":
          description: "`ACCOUNT_LOCKED`"
          headers:
            Retry-After:
              schema: { type: integer, minimum: 0 }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/v1/me/mfa/disable:
    post:
      tags: [Hesap]
      summary: İki adımlı doğrulamayı kapatır
      description: |
        Mevcut parola ile doğrulayıcı uygulamadaki kod ya da bir kurtarma kodu istenir.
        Yanlış parola ve yanlış kod başarısız deneme sayacını artırır. Kullanıcının diğer
        oturumları kapatılır, isteği yapan oturum artık MFA'lı sayılmaz.
      operationId: disableMfa
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [current_password]
              properties:
                current_password: { type: string, format: password }
                code: { type: string }
                recovery_code: { type: string, maxLength: 32 }
      responses:
        "204":
          description: MFA kapandı
        "400":
          description: "`VALIDATION_FAILED`, `INVALID_CURRENT_PASSWORD` ya da `INVALID_MFA_CODE`"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: "`MFA_NOT_ENABLED`"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429":
          description: "`ACCOUNT_LOCKED`"
          headers:
            Retry-After:
              schema: { type: integer, minimum: 0 }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/v1/me/mfa/recovery-codes:
    post:
      tags: [Hesap]
      summary: Kurtarma kodlarını yeniler
      description: |
        Doğrulayıcı uygulamadaki kod istenir (kurtarma kodu kabul edilmez). Eski kodların
        hepsi geçersiz olur, yeni 10 kod sadece bu yanıtta görünür.
      operationId: regenerateRecoveryCodes
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code: { type: string }
      responses:
        "200":
          description: Yeni kodlar
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryCodes" }
        "400":
          description: "`VALIDATION_FAILED` ya da `INVALID_MFA_CODE`"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: "`MFA_NOT_ENABLED`"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429":
          description: "`ACCOUNT_LOCKED`"
          headers:
            Retry-After:
              schema: { type: integer, minimum: 0 }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/v1/me/password:
    post:
      tags: [Hesap]
      summary: Parola değiştirme
      description: |
        Mevcut parola doğrulanır. Yanlış mevcut parola, girişteki başarısız denemelerle
        aynı sayacı artırır (5 denemede hesap kilitlenir). Başarılı değişiklikten sonra
        isteği yapan oturum açık kalır, kullanıcının diğer bütün oturumları kapatılır ve
        `must_change_password` kalkar.
      operationId: changePassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [current_password, new_password]
              properties:
                current_password: { type: string, format: password }
                new_password: { type: string, format: password, minLength: 10, maxLength: 128 }
      responses:
        "204":
          description: Parola değişti
        "400":
          description: |
            `VALIDATION_FAILED` (yeni parola politikaya uymuyor; `errors[].code`:
            `TOO_SHORT`, `TOO_LONG`, `TOO_COMMON`, `CONTAINS_PERSONAL_INFO`, `SAME_AS_CURRENT`)
            ya da `INVALID_CURRENT_PASSWORD`
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429":
          description: "`ACCOUNT_LOCKED`: çok sayıda yanlış parola denemesi"
          headers:
            Retry-After:
              schema: { type: integer, minimum: 0 }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/v1/me/sessions:
    get:
      tags: [Hesap]
      summary: Oturumlarım
      description: |
        Kullanıcının kullanılabilir oturumları, son görülmeye göre sıralı. Boşta kalma
        süresi dolmuş oturumlar listelenmez. Tarayıcı ve işletim sistemi User-Agent'tan
        kaba olarak çıkarılır (kullanıcının "bu benim mi?" sorusu için).
      operationId: listMySessions
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Oturumlar
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [Hesap]
      summary: Diğer bütün oturumları kapat
      description: İsteği yapan oturum açık kalır. Kapatılan oturumların access token'ları da hemen geçersiz olur.
      operationId: endOtherSessions
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Kapatılan oturum sayısı
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked: { type: integer, minimum: 0 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/me/sessions/{id}:
    delete:
      tags: [Hesap]
      summary: Bir oturumu kapat
      description: Oturum kullanıcıya ait değilse 404 döner. Zaten kapalıysa 204.
      operationId: endSession
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Oturum kapatıldı
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/me/security-events:
    get:
      tags: [Hesap]
      summary: Hesabımdaki güvenlik olayları
      description: Giriş geçmişi, başarısız denemeler, parola değişiklikleri. En yeniden eskiye.
      operationId: listMySecurityEvents
      security:
        - bearerAuth: []
      parameters:
        - name: type
          in: query
          schema: { $ref: "#/components/schemas/SecurityEventType" }
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Olaylar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecurityEventPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/me/permissions:
    get:
      tags: [Hesap]
      summary: Oturum açmış kullanıcının yetkileri
      description: |
        Şu anda geçerli yetkiler ve kapsamları. Web arayüzü menüleri ve butonları buna
        göre gösterir. Asıl kontrol her zaman sunucudadır.
      operationId: getMyPermissions
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Yetkiler (yetki koduna ve kapsama göre sıralı)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Grant" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/users:
    get:
      tags: [Kullanıcılar]
      summary: Hesapları listeler
      description: Kullanıcı adına göre sıralı, cursor ile sayfalanır.
      operationId: listUsers
      x-agora-permission: user:read
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          description: Kullanıcı adı, e-posta ya da ad soyadda geçen metin
          schema: { type: string, maxLength: 100 }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/UserStatus" }
        - name: kind
          in: query
          schema: { type: string, enum: [STUDENT, STAFF] }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Hesaplar
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/UserSummary" }
                  next_cursor: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Kullanıcılar]
      summary: Hesap oluşturur
      description: |
        Kişi, öğrenci ya da personel kaydı ve hesap birlikte oluşturulur. Hesap
        `PENDING` başlar ve kullanıcıya 72 saat geçerli bir aktivasyon e-postası
        gönderilir: kullanıcı kendi parolasını belirleyince hesap etkinleşir. Yönetici
        parola görmez ya da belirlemez. Numara kullanıcı adı olur.
      operationId: createUser
      x-agora-permission: user:manage
      x-agora-mfa: true
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserRequest" }
      responses:
        "201":
          description: Hesap oluşturuldu
          headers:
            Location:
              schema: { type: string, examples: ["/api/v1/users/01a11b7f-..."] }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: "`ACCOUNT_EXISTS`: numara ya da e-posta başka bir hesapta kayıtlı"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/v1/users/{id}/status:
    put:
      tags: [Kullanıcılar]
      summary: Hesabın durumunu değiştirir
      description: |
        Askıya alınan (`SUSPENDED`) ya da kapatılan (`DISABLED`) hesabın bütün
        oturumları hemen sonlanır. Kişi kendi hesabının durumunu değiştiremez.
        Aktivasyonu tamamlanmamış (`PENDING`) bir hesap elle etkinleştirilemez.
        Gerekçe denetim kaydına yazılır.
      operationId: setUserStatus
      x-agora-permission: user:manage
      x-agora-mfa: true
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status, reason]
              properties:
                status: { type: string, enum: [ACTIVE, SUSPENDED, DISABLED] }
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "204":
          description: Durum değişti
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "`FORBIDDEN` ya da `SELF_ACTION_FORBIDDEN`"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`INVALID_STATUS_CHANGE`: PENDING bir hesap elle etkinleştirilemez"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/v1/users/{id}/activation-email:
    post:
      tags: [Kullanıcılar]
      summary: Aktivasyon e-postasını yeniden gönderir
      description: Sadece PENDING hesaplarda. Önceki bağlantılar geçersiz olur.
      operationId: resendActivationEmail
      x-agora-permission: user:manage
      x-agora-mfa: true
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "202":
          description: E-posta kuyruğa alındı
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`ACCOUNT_NOT_PENDING`"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/v1/users/{id}/password-reset-email:
    post:
      tags: [Kullanıcılar]
      summary: Kullanıcıya parola sıfırlama e-postası gönderir
      description: Yardım masası için. Bağlantı kullanıcının e-postasına gider, yönetici görmez. Sadece ACTIVE hesaplarda.
      operationId: sendPasswordResetEmail
      x-agora-permission: user:manage
      x-agora-mfa: true
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "202":
          description: E-posta kuyruğa alındı
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`ACCOUNT_NOT_ACTIVE`"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/v1/users/{id}/mfa/reset:
    post:
      tags: [Kullanıcılar]
      summary: Kullanıcının iki adımlı doğrulamasını sıfırlar
      description: |
        Telefonunu ve kurtarma kodlarını kaybeden kullanıcı için. Kimlik yüz yüze
        doğrulanmalıdır: bu işlem hesabı devralmanın en kısa yoludur, gerekçe zorunludur
        ve denetim izine yazılır. Kullanıcının bütün oturumları kapatılır. Yönetici kendi
        MFA'sını bu uçla kapatamaz.
      operationId: resetUserMfa
      x-agora-permission: user:manage
      x-agora-mfa: true
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "204":
          description: MFA kapatıldı
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "Bkz. genel 403 kodları ve `SELF_ACTION_FORBIDDEN`"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`MFA_NOT_ENABLED`"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/v1/roles:
    get:
      tags: [Kullanıcılar]
      summary: Rol kataloğu
      description: Bütün roller, kapsam türleri ve verdikleri yetkiler. Giriş yapmış her kullanıcıya açıktır.
      operationId: listRoles
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Roller (koda göre sıralı)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/RoleDefinition" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/users/{id}/roles:
    get:
      tags: [Kullanıcılar]
      summary: Kullanıcının rol atamaları
      description: Geçmiş, şimdiki ve ileri tarihli bütün atamalar, en yeniden eskiye.
      operationId: listUserRoles
      x-agora-permission: user:read
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Atamalar
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Assignment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Kullanıcılar]
      summary: Rol atar
      description: |
        Kapsam kimliği rolün kapsam türüne uymalıdır (üniversite geneli ve kapsamsız
        rollerde boş). Kişi kendine rol atayamaz. Aynı rol aynı kapsamda çakışan bir
        dönemde atanamaz. Değişiklik kullanıcının bir sonraki isteğinde etkilidir.
        Gerekçe zorunludur ve denetim kaydına yazılır.
      operationId: assignRole
      x-agora-permission: role:assign
      x-agora-mfa: true
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role, reason]
              properties:
                role: { type: string, examples: ["DEPARTMENT_HEAD"] }
                scope_id: { type: string, format: uuid }
                valid_from: { type: string, format: date-time, description: Boşsa hemen }
                valid_until: { type: string, format: date-time, description: Boşsa süresiz }
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "201":
          description: Atama oluşturuldu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Assignment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "`FORBIDDEN` ya da `SELF_ACTION_FORBIDDEN`"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`ROLE_ALREADY_ASSIGNED`"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/v1/users/{id}/roles/{assignment}/end:
    post:
      tags: [Kullanıcılar]
      summary: Rol atamasını sonlandırır
      description: |
        Başlamış atamanın bitişi "şimdi" yapılır (geçmiş korunur). Henüz başlamamış
        atama iptal edilir. Zaten bitmiş atama için bir şey yapılmaz (204). Son aktif
        sistem yöneticisinin rolü sonlandırılamaz.
      operationId: endRoleAssignment
      x-agora-permission: role:assign
      x-agora-mfa: true
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ID"
        - name: assignment
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "204":
          description: Atama sonlandırıldı
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "`FORBIDDEN` ya da `SELF_ACTION_FORBIDDEN`"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`LAST_SYSTEM_ADMIN`"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/v1/users/{id}:
    get:
      tags: [Kullanıcılar]
      summary: Bir kullanıcının profilini döndürür
      operationId: getUser
      x-agora-permission: user:read
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Profil
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/audit/log:
    get:
      tags: [Denetim]
      summary: Denetim kayıtlarını listeler
      description: En yeniden eskiye sıralı, cursor ile sayfalanır.
      operationId: listAuditLog
      x-agora-permission: audit:read
      x-agora-mfa: true
      security:
        - bearerAuth: []
      parameters:
        - name: actor_user_id
          in: query
          schema: { type: string, format: uuid }
        - name: action
          in: query
          description: kaynak.eylem, ör. role.assign
          schema: { type: string }
        - name: entity_type
          in: query
          schema: { type: string }
        - name: entity_id
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Denetim kayıtları
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AuditLogEntry" }
                  next_cursor: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/audit/security-events:
    get:
      tags: [Denetim]
      summary: Güvenlik olaylarını listeler
      description: En yeniden eskiye sıralı, cursor ile sayfalanır.
      operationId: listSecurityEvents
      x-agora-permission: audit:read
      x-agora-mfa: true
      security:
        - bearerAuth: []
      parameters:
        - name: user_id
          in: query
          schema: { type: string, format: uuid }
        - name: type
          in: query
          schema: { $ref: "#/components/schemas/SecurityEventType" }
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Güvenlik olayları
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecurityEventPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/academic-years:
    get:
      tags: [Akademik takvim]
      summary: Akademik yılları ve dönemlerini listeler
      description: En yeniden eskiye. Her yıl dönemleriyle (güz, bahar, yaz) birlikte döner.
      operationId: listAcademicYears
      x-agora-permission: calendar:read
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Yıllar
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AcademicYear" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Akademik takvim]
      summary: Akademik yıl tanımlar
