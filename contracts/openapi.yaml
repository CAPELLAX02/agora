      summary: Müfredat sürümünü satırları ve özetiyle döndürür
      description: Taslak sürüm, programın müfredatını yönetemeyen kullanıcıya 404 döner.
      operationId: getCurriculum
      x-agora-permission: curriculum:read
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Sürüm
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurriculumDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Müfredat]
      summary: Sürümün bilgilerini günceller
      description: >-
        Taslakta her alan değişir. Yürürlükteki sürümde giriş yılı başlangıcı ve AKTS toplamı
        donmuştur; adlar, karar bilgisi ve yeni girişlere kapanış yılı değişebilir. İyimser
        kilit, `If-Match` zorunlu.
      operationId: updateCurriculum
      x-agora-permission: curriculum:manage
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CurriculumRequest" }
      responses:
        "200":
          description: Güncel sürüm
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurriculumDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`CURRICULUM_NOT_DRAFT`: yürürlükteki sürümde donmuş alan değişti, `CURRICULUM_OVERLAP`: giriş yılları çakışıyor, `CURRICULUM_IN_USE`: bağlı öğrenciler aralık dışında kalıyor"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "412": { $ref: "#/components/responses/VersionMismatch" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
    delete:
      tags: [Müfredat]
      summary: Taslak sürümü siler
      operationId: deleteCurriculum
      x-agora-permission: curriculum:manage
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204": { description: Silindi }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`CURRICULUM_NOT_DRAFT`: sürüm taslak değil"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/v1/curricula/{id}/activate:
