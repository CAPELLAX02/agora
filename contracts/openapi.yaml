          content:
            application/json:
              schema: { $ref: "#/components/schemas/OfferingDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`SECTION_CODE_TAKEN`, `INVALID_STATUS_TRANSITION`: iptal edilmiş ya da kapanmış ders, `TERM_CLOSED`"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/v1/sections/{id}:
    get:
      tags: [Ders açma]
      summary: Şubeyi döndürür
      operationId: getSection
      x-agora-permission: course:read
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Şube
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Section" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Ders açma]
      summary: Şubeyi günceller
      description: >-
        Gönderilmeyen alanlar değişmez, şube kodu değiştirilemez. Kontenjan kayıtlı öğrencinin
        ve program kontenjanları toplamının altına inemez; teorik oturumların derslikleri yeni
        kontenjanı almalıdır. İptal (status CANCELLED) kayıtlı öğrenci yokken yapılır ve
        oturumları siler.
      operationId: updateSection
      x-agora-permission: section:manage
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SectionRequest" }
      responses:
        "200":
          description: Güncel şube
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Section" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`BELOW_ENROLLED`, `QUOTA_EXCEEDS_CAPACITY`, `CLASSROOM_TOO_SMALL`, `HAS_ENROLLMENTS` ya da `SECTION_CANCELLED`"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "412": { $ref: "#/components/responses/VersionMismatch" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
    delete:
      tags: [Ders açma]
      summary: Kayıtlı öğrencisi olmayan şubeyi siler
      operationId: deleteSection
      x-agora-permission: section:manage
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204": { description: Silindi }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`HAS_ENROLLMENTS`: kayıtlı öğrenci var"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/v1/sections/{id}/instructors:
